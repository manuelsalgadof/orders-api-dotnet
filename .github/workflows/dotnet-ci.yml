name: CI/CD Azure Container Apps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: manuelsalgadofuentes/orders-api
  CONTAINER_APP_NAME: orders-api-app
  RESOURCE_GROUP: rg-orders-demo

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test OrdersApi.Tests/OrdersApi.Tests.csproj --no-build --configuration Release --verbosity normal

  docker-deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f OrdersApi/Dockerfile .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate required deployment secrets
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          ADMIN_SEED_NAME: ${{ secrets.ADMIN_SEED_NAME }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
        run: |
          missing=0
          [ -z "$DB_CONNECTION" ]       && echo "::error::DB_CONNECTION secret is missing or empty"       && missing=1
          [ -z "$JWT_KEY" ]             && echo "::error::JWT_KEY secret is missing or empty"             && missing=1
          [ -z "$ADMIN_SEED_NAME" ]     && echo "::error::ADMIN_SEED_NAME secret is missing or empty"     && missing=1
          [ -z "$ADMIN_SEED_EMAIL" ]    && echo "::error::ADMIN_SEED_EMAIL secret is missing or empty"    && missing=1
          [ -z "$ADMIN_SEED_PASSWORD" ] && echo "::error::ADMIN_SEED_PASSWORD secret is missing or empty" && missing=1
          [ "$missing" -ne 0 ] && exit 1
          echo "All required secrets present."

      - name: Deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set env vars
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              ASPNETCORE_ENVIRONMENT=Production \
              ASPNETCORE_URLS=http://+:8080 \
              ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION }}" \
              AdminSeed__Name="${{ secrets.ADMIN_SEED_NAME }}" \
              AdminSeed__Email="${{ secrets.ADMIN_SEED_EMAIL }}" \
              AdminSeed__Password="${{ secrets.ADMIN_SEED_PASSWORD }}" \
              Jwt__Key="${{ secrets.JWT_KEY }}" \
              Cors__AllowedOrigins__0="${{ secrets.CORS_ALLOWED_ORIGIN }}"