name: CI/CD Azure Container Apps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: orders-api
  CONTAINER_APP_NAME: orders-api-app
  RESOURCE_GROUP: rg-orders-demo

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test OrdersApi.Tests/OrdersApi.Tests.csproj --no-build --configuration Release --verbosity normal

  docker-deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/orders-api:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/orders-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/orders-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/orders-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/orders-api:latest

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.DOCKER_USERNAME }}/orders-api:${{ github.sha }}

      - name: Set env vars
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              ASPNETCORE_ENVIRONMENT=Production \
              ASPNETCORE_URLS=http://+:8080 \
              ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION }}"